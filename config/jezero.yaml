# The Jezero test scene, built from public USGS Mars 2020 TRN products.
#   uv run snakemake --profile profiles/local jezero
# Facts below were read from the USGS product pages on 2026-11-01; each says where.

# Fergason et al. 2020 (LPSC 51, abstract 2020): Mars 2020 TRN flight product generation.
mosaics:
  dtm:
    # HiRISE DTM mosaic, 1 m/pixel, 32-bit, 1.8 GB. doi:10.5066/P9REJ9JN
    url: https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE/JEZ_hirise_soc_006_DTM_MOLAtopography_DeltaGeoid_1m_Eqc_latTs0_lon0_blend40.tif
    # USGS publishes no checksums; pinned from the first download (2026-11-01).
    sha256: 44c3819caa33922b06f7a8228534d1e32ab4087aca85144136d825c371c747d8
  ortho:
    # HiRISE orthorectified image mosaic, 0.25 m/pixel, 8-bit, 6.9 GB. doi:10.5066/P9QJDP48
    url: https://planetarymaps.usgs.gov/mosaic/mars2020_trn/HiRISE/JEZ_hirise_soc_006_orthoMosaic_25cm_Eqc_latTs0_lon0_first.tif
    sha256: 83f3faeabc87ba54db9af278611bd070494a0b0d43757108c871c763943e80d9
  # The CTX ring around the HiRISE tile (issue #33; docs/research/ctx-terrain-for-a-wider-tile.md).
  # Same projection as HiRISE, but NOT the same pixel grid: the CTX origin is 0.749 m east and
  # 3.140 m north of a 6 m HiRISE pixel corner (read from both GeoTIFF headers, 2026-11-02).
  ctx_dtm:
    # CTX DTM mosaic, 20 m/pixel, 32-bit, 9.7 MB. doi:10.5066/P906QQT8
    url: https://planetarymaps.usgs.gov/mosaic/mars2020_trn/CTX/JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0.tif
    # Pinned from the first download (2026-11-02).
    sha256: 16a1aa66c3f48c1bca252795827db7b417876217aff0f5e1aff18027fab2327b
  ctx_ortho:
    # CTX orthoimage mosaic, 6 m/pixel, 8-bit, 36.3 MB: the LVS map itself, per USGS. doi:10.5066/P9GV1ND3
    url: https://planetarymaps.usgs.gov/mosaic/mars2020_trn/CTX/JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif
    sha256: 842b457afee7c2672022b66e3f60be836c6d52e99474015bfd9ced60099b8615

# Both HiRISE mosaics cover this box (planetocentric, east longitude), per their USGS pages.
mosaic_footprint:
  lat_min: 18.3068
  lat_max: 18.6693
  lon_min: 77.2229
  lon_max: 77.584

# Both CTX mosaics cover this box, per their FGDC metadata (DTM east edge 77.6990, ortho 77.6992).
ctx_footprint:
  lat_min: 18.2110
  lat_max: 18.7212
  lon_min: 77.1605
  lon_max: 77.6992

# No Jezero leakage (spec): matcher training and validation data must stay out of this box.
# It holds everything the test scene can show: both mosaic footprints, so the whole CTX ring.
# tests/terrain/test_scene.py checks the scene and both footprints sit inside it.
jezero_exclusion:
  lat_min: 18.2110
  lat_max: 18.7212
  lon_min: 77.1605
  lon_max: 77.6992

# Spherical Mars radius of the mosaics' projection (USGS pages: "Radius A/C 3396190").
mars_radius_m: 3396190

# Perseverance's Lander Vision System imaged between these heights above the ground.
# NASA/JPL, Mars 2020 Perseverance Landing Press Kit (February 2021), pp. 21-22: LVS
# "operates when the spacecraft is between about ... 4.2 to 2.2 kilometers, above the
# ground". A pre-landing plan, not a flight reconstruction.
lvs_altitude_m:
  top: 4200
  bottom: 2200

tile:
  # Perseverance's touchdown point, Octavia E. Butler Landing. Way et al. 2022 (Mars 2020
  # EDL flight reconstruction, Table 1) give 18.44463 N, 77.45088 E from HiRISE, within
  # about 5 m of the value below.
  center_lon: 77.4508
  center_lat: 18.4447
  # Map metres, grown outward to a 12 m grid (whole mesh, texture and map pixels), so
  # the cut is slightly over 10 km. Over lvs_altitude_m a nadir 90 deg LCAM view
  # covers 4.4-8.4 km. Valid DTM and orthoimage reach a 10.14 km square around
  # the landing site. See docs/research/descent-altitude-and-tile-size.md.
  size_m: 10000
  # Both area-averaged from the 1 m DTM and 0.25 m orthoimage. LCAM pixels cover
  # 4.3 m (2.2 km) to 8.2 m (4.2 km) at the image centre, so neither is coarser than
  # what the camera resolves. At 2 m / 1 m the 10 km mesh filled the laptop's 8 GB
  # GPU and rendered corrupt images.
  mesh_resolution_m: 4.0
  texture_resolution_m: 2.0

# The wide scene (src/fidelis/terrain/scene.py): the tile above in the middle, a CTX ring
# around it, both meshed in the tile's frame with Mars's curvature (#33).
scene:
  # Map metres. The ring's mesh reaches at least half this from the tile centre every way:
  # 13 km north-south, 12.3 km east-west on the ground. Valid CTX reaches a 27.7 km square.
  size_m: 26000
  # The HiRISE tile eases into CTX (heights and texture) across this band inside its edge.
  # CTX - HiRISE heights over the tile: median +0.32 m, sd 3.11 m (fidelis-scene, 2026-11-02;
  # docs/benchmarks/wide-scene.md). Over a 200 m ramp a typical few-metre difference adds
  # a slope of a few percent; the largest isn't measured. A Fidelis choice.
  blend_band_m: 200

matching_map:
  # The map is the orthoimage averaged down to the LVS map's resolution.
  lvs_map_resolution:
    value_m: 6.0
    source: >-
      Cheng, Ansar & Johnson 2021, Making an Onboard Reference Map From MRO/CTX Imagery
      for Mars 2020 Lander Vision System, Earth and Space Science 8, doi:10.1029/2020EA001560,
      Table 1 (LVS Reference Map Requirements): "The LVS appearance map shall be 6 m/pixel".
      Also USGS, Mars 2020 TRN CTX Orthorectified Image Mosaic (doi:10.5066/P9GV1ND3):
      "This product is the Lander Vision System (LVS) map".
  ctx_ground_resolution:
    value_m: 6.0
    source: >-
      Malin et al. 2007, Context Camera Investigation on board the Mars Reconnaissance
      Orbiter, JGR 112, E05S04, doi:10.1029/2006JE002808; about 6 m/pixel from MRO's
      mapping orbit (PDS CTX instrument description). Cheng et al. 2021, section 2.1:
      CTX acquires "images at 6 m per pixel scale over a swath 30 km wide".

# Per-descent random inputs (src/fidelis/scenario.py). Sources and reasoning:
# docs/research/edl-dispersions-for-scenario-sampler.md. Every distribution is bounded,
# and load_config refuses any whose worst case could see past the scene (scene.size_m):
# the highest altitude plus terrain_relief_m, at the largest tilt, through the image corner,
# from the largest offset. On the 10 km tile alone that check capped tilt at 3 deg and
# offset at +-400 m; the CTX-ringed scene (#33) lifts the cap to the values below.
scenario:
  # LCAM: 90 x 90 deg (Maki et al. 2020; docs/camera-conventions.md).
  camera_fov_deg: 90
  # How much lower a view's edge can be than the ground under the camera: the HiRISE tile's
  # highest ground down to the scene's lowest, curvature included. Measured 351.3 m
  # (fidelis-scene's drop_below_tile_m, 2026-11-02), rounded up. Valid while the camera is
  # over the tile, which load_config enforces. The crater rim (whole-scene relief 1203 m) is
  # uphill, which only shortens views.
  terrain_relief_m: 352
  # Above the ground beneath the camera. Brackets the sourced handoff values: "approximately
  # 2200m" (Johnson et al. 2022), back-shell separation 2276 m flown, final-fix image an
  # inferred 2.36-2.44 km. Uniform is a Fidelis choice; no spread is published.
  altitude_m: {dist: uniform, low: 2200, high: 2450}
  # True position, ground metres from the tile centre. sd from the pre-flight 99% landing
  # ellipse (7.1 x 6.5 km, Way et al. 2020) as sigma ~ 1.1 km. Truncated at 2.5 sigma
  # (keeps 98.8% of the normal), a Fidelis choice the scene leaves room for.
  offset_east_m: {dist: truncnorm, mean: 0, sd: 1100, low: -2750, high: 2750}
  offset_north_m: {dist: truncnorm, mean: 0, sd: 1100, low: -2750, high: 2750}
  # Off nadir. Flight pitch swung about -12 to +5 deg; pre-flight simulations averaged
  # 7-18 deg (Johnson et al. 2020, 2022, read from plots). Up to the top of that range;
  # uniform is a Fidelis choice. Worst case reaches about 11.8 km of the scene's 12.3 km
  # east-west half-width (20 deg would not fit).
  tilt_deg: {dist: uniform, low: 0, high: 18}
  # No source gives either; heading drifted ~70 deg in 35 s on the parachute. Fidelis choice.
  tilt_azimuth_deg: {dist: uniform, low: 0, high: 360}
  heading_deg: {dist: uniform, low: 0, high: 360}
  # Fraction of full scale. Flight: ~0.75 DN at the 60 DN mean (0.3%); design: < 2 DN
  # (0.8%), both computed from Maki et al. 2020 Table 5. The low end reaches a little
  # below flight, as the research note suggests.
  noise_sd: {dist: uniform, low: 0.002, high: 0.008}
  # Up to the ~0.5 px of the 1 ms exposure requirement at 50 deg/s (computed); flight's
  # shorter exposures blurred far less. A sensitivity knob more than a flight value.
  blur_px: {dist: uniform, low: 0, high: 0.5}
  # A linear blur looks the same both ways, so half a turn covers every direction.
  blur_angle_deg: {dist: uniform, low: 0, high: 180}
  # Flight images came out at 0.6x their exposure target; LVS tolerated 1/4x to 4x.
  # The range around the flight value is a Fidelis choice.
  exposure_gain: {dist: uniform, low: 0.5, high: 1.5}
  # Five pre-rendered sun angles; the splat ticket (#20) defines them and must keep five.
  # Suggested: the landing-day sun (257 deg az, 40 deg el) plus the corners of LVS's design
  # box, 240-310 deg az by 25-55 deg el.
  sun_index: {dist: integers, low: 0, high: 4}

# The sun angles the mesh renderer lights the scene with; scenario.sun_index picks one,
# so there must be as many as sun_index can draw. These are the five suggested above: the
# landing-day sun plus the corners of LVS's design box. The splat ticket (#20) may revise them.
suns:
  - {azimuth_deg: 257, elevation_deg: 40}
  - {azimuth_deg: 240, elevation_deg: 25}
  - {azimuth_deg: 240, elevation_deg: 55}
  - {azimuth_deg: 310, elevation_deg: 25}
  - {azimuth_deg: 310, elevation_deg: 55}

# The simulation interface (src/fidelis/simulation.py).
simulation:
  # Path-tracing samples per pixel for the "mesh" fidelity. At 64 spp the render's own noise
  # was 1.2-1.6% of the median pixel against 1024 spp, and 64 spp took 0.053 s
  # (docs/benchmarks/mesh-render.md). 256 should halve that noise (Monte Carlo noise falls as
  # 1/sqrt(spp); computed, not measured). How it compares with the camera noise drawn above
  # isn't known: that is a fraction of full scale, this a fraction of the median pixel.
  mesh_spp: 256

# The splat scene (src/fidelis/splat/): `snakemake splat`, then `snakemake plain_mc_splat`.
splat:
  # The one sun trained so far (#9): the landing-day sun. #20 trains all five. Until then
  # Monte Carlo on the splat pins every descent to this sun (--sun-index).
  sun_index: 0
  # Training and held-out views are scenario draws on seeds of their own
  # (src/fidelis/splat/views.py). 300 views of a ~4.6 km square footprint (nadir, 2.3 km up)
  # over the ~100 km^2 tile average about 60 views per tile point, more near the centre where
  # the offsets cluster (computed, not measured). spp as the
  # simulator's mesh_spp, so the targets are as clean as what the mesh fidelity renders.
  views: {train: 300, heldout: 20, spp: 256}
  # gsplat simple_trainer's defaults (src/fidelis/splat/train.py).
  steps: 30000
  ssim_weight: 0.2
  log_every: 500
  # PROVISIONAL, a Fidelis choice: every held-out view must reach both, measured against
  # the camera's full scale (src/fidelis/splat/metrics.py). 30 dB is an RMS error of 3.2%
  # of full scale: 4-16x the camera noise the sampler draws (0.2-0.8%), so this asks for a
  # close approximation, not an indistinguishable one. Whether that's close enough is what
  # plain Monte Carlo on mesh vs splat (both pinned to this sun) answers. A constant image
  # must fail it in every view, or the gate fails too: quality.json reports that baseline.
  quality: {psnr_db_min: 30, ssim_min: 0.9}

# The first end-to-end estimate (src/fidelis/plain_mc.py): `snakemake plain_mc`.
plain_mc:
  samples: 20
  # A descent fails if it gets no fix, or its fix is more than r off in the map frame (below).
  # r is LVS's requirement and is never tuned to a target failure rate
  # (docs/adr/0003-failure-is-40m-in-the-map-frame.md). Other lines, 12 m included, can be
  # read off the stored errors, labelled exploratory.
  r_m:
    value: 40
    source: >-
      Mohan et al. 2021, Assessment of M2020 Terrain Relative Landing Accuracy: Flight
      Performance vs. Predicts, AAS 21-541, p.4: LVS shall "generate a solution with less
      than 40m accuracy within 10s of initialization, 99% of the time"
      (docs/research/lvs-error-sources.md).

# The whole-map offset between the matching map and the rendered scene: where the map puts a
# ground feature, less where the scene has it, metres east and north (src/fidelis/map_frame.py).
# Removed from every fix before failures are counted, and reported on its own (ADR 0003).
# Measured by registering the two orbital images (#40), never from descent results.
map_offset:
  east_m: 0.0
  north_m: 0.0
  source: >-
    Zero by construction: the matching map is a block average of the same HiRISE
    orthoimage the scene renders, so the two share one frame exactly. #36 switches to the
    CTX map, and #40's measured offset replaces this.
